# Render Blueprint for BIM Data Execution
# One free web service + a persistent disk so the master DB survives restarts.
services:
  - type: web
    name: bim-data-execution
    runtime: python
    plan: free                      # free instance (sleeps when idle; see DEPLOY.md)
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 0
    envVars:
      - key: SEAMLESS_API_KEY       # set this in the Render dashboard (secret)
        sync: false
      - key: APP_PASSWORD           # shared team password (set in dashboard)
        sync: false
      - key: APP_SECRET             # random session secret
        generateValue: true
      - key: GDRIVE_CLIENT_ID       # Google Drive: OAuth client id
        sync: false
      - key: GDRIVE_CLIENT_SECRET   # Google Drive: OAuth client secret
        sync: false
      - key: GDRIVE_REFRESH_TOKEN   # Google Drive: refresh token from get_drive_token.py
        sync: false
      - key: GDRIVE_FOLDER_ID       # Google Drive: target folder id (results + master)
        sync: false
      - key: GDRIVE_INPUT_FOLDER    # Watched folder: drop files here to auto-process
        sync: false
      - key: GDRIVE_OUTPUT_FOLDER   # Watched folder: results appear here
        sync: false
      - key: AUTO_MAX_COMPANIES     # safety cap on auto-processed files
        value: "50"
      - key: DATA_DIR
        value: /var/data            # where uploads/outputs live
      - key: MASTER_DB_PATH
        value: /var/data/bim_master.db
    disk:
      name: bim-data
      mountPath: /var/data          # persistent disk keeps the master DB (paid tiers only)
      sizeGB: 1